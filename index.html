<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDRES LUCAS — Webhook Logging Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- APP -->
    <div class="app-side">
        <h1>☁️ ANDRES LUCAS LOGGER</h1>
        <p class="sub">Haz clic en una tarea para completarla y disparar el webhook.</p>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Nueva tarea...">
            <button onclick="addTask()">Añadir</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <!-- LOGS -->
    <div class="logs-side">
        <!-- Contadores -->
        <div class="stats-row">
            <div class="stat-box stat-ok">
                <div class="num" id="count-ok">0</div>
                <div class="label">Webhooks OK</div>
            </div>
            <div class="stat-box stat-error">
                <div class="num" id="count-error">0</div>
                <div class="label">Webhooks Fallidos</div>
            </div>
        </div>

        <!-- Consola de Chrome -->
        <div class="chrome-console" id="console">
            <div class="console-header-bar">
                <span class="active">Console</span>
                <span>Network</span>
                <span>Sources</span>
            </div>
            <div style="color:#666;">// Esperando acciones...</div>
        </div>

        <!-- Tabla de Supabase -->
        <div class="supabase-panel">
            <div class="supabase-header">
                <span>📊 Supabase → tabla: webhook_logs</span>
                <span style="color:#2ecc71;">● Live</span>
            </div>
            <div class="supabase-table" id="supabaseTable">
                <div class="table-row header">
                    <span>FECHA</span>
                    <span>ERROR</span>
                    <span>ESTADO</span>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
